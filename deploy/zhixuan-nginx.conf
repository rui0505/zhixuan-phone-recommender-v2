limit_req_zone $binary_remote_addr zone=zhixuan_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=zhixuan_explain:1m rate=1r/m;
server {
    listen 80 default_server;
    server_name 47.243.189.12 _;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location = /api/v1/explain {
        limit_req zone=zhixuan_explain burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8600;
        proxy_read_timeout 25s;
    }
    location /api/ {
        limit_req zone=zhixuan_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8600;
        proxy_read_timeout 25s;
    }
    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_read_timeout 25s;
    }
}
