<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>反馈管理 · 知选</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/glass.css"><link rel="stylesheet" href="/feedback.css?v=feedback-20261028"><script type="module" src="/feedback-admin.mjs?v=feedback-20261028"></script></head>
<body class="feedback-admin-body"><div class="app-shell"><header class="header"><a class="brand" href="/" aria-label="返回知选首页"><img class="brand-symbol" src="/assets/icons/phone.svg" alt=""><span>知选 <small>ZHIXUAN</small></span></a><a href="/">返回网站 →</a></header>
<main class="feedback-admin-main"><h1>反馈管理</h1><p class="feedback-admin-intro">先看真实体验，再决定哪些评论适合公开。未通过审核的反馈只在这里显示。</p>
