name: Offline catalog checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PHONE_ENABLE_LLM: 'false'
      LLM_API_KEY: ''
      LLM_ENV_FILE: .env.must-not-exist-during-tests
      PHONE_CATALOG_DB: data/catalog.sqlite
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py --root .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s data_pipeline/tests -p 'test_*.py' -v
